[test]
# Loads React DOM against a page once, before any test file; see the file for why.
# Then keeps the API's log lines out of the test output.
preload = ["./web/test/preload.ts", "./server/quiet.ts"]
coverageSkipTestFiles = true
# scripts/coverage.ts reads the lcov report and gates the totals.
coverageReporter = ["text", "lcov"]
