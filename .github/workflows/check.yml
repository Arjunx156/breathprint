name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The same steps as `just check`: lint, types, tests, build with the JS budget, eval replay.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x biome ci .
      - run: bun x tsc --noEmit
      - run: bun test --coverage
      - run: bun run scripts/coverage.ts
      - run: bun run build
      - run: bun run evals/run.ts --replay
      # picomatch's ReDoS sits in Vite's build-time globbing, fed only our own
      # config, and has no fixed release yet. Nothing that ships is affected.
      - run: bun audit --ignore=GHSA-fc5q-39xc-vjpf

  # The demo path and an axe scan of every page, light and dark.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun x playwright test
